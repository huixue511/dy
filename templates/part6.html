{% extends 'base.html' %}
{% block content %}
<style>
    /* 卡片基础样式 */
    .card {
        border: none;
        border-radius: 0.25rem;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        transition: all 0.3s ease;
    }

    /* 卡片悬停效果 */
    .card:hover {
        box-shadow: 0 0.5rem 2rem 0 rgba(58, 59, 69, 0.2);
        transform: translateY(-2px);
    }

    /* 主色调背景（蓝色渐变） */
    .bg-primary {
        background-color: #4e73df !important;
        background-image: linear-gradient(180deg, #4e73df 10%, #224abe 100%);
    }

    /* 加载动画遮罩层 */
    .loading-spinner {
        position: absolute; /* 填充填充逻辑：需在父级 position-relative 下绝对定位 */
        top: 0;
        left: 0;
        z-index: 1000;
        background-color: rgba(255, 255, 255, 0.7);
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
    }
</style>
    
    <div class="page-content">
    <div class="page-header bg-primary text-white">
        <div class="container-fluid">
            </div>
    </div>

    <section class="no-padding-top no-padding-bottom">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-12">
                    <div class="block card">
                        <div class="card-header bg-white">
                            <h5 class="card-title mb-0">
                                <i class="fas fa-chart-pie"></i> 评论词云图
                            </h5>
                            <p class="text-muted small mb-0">展示评论中出现频率最高的词汇</p>
                        </div>

                        <div class="block-body p-0">
                            <div id="wordcloud-container" class="text-center p-4" style="min-height: 400px;">
                                
                                <div class="position-relative" style="width: 100%; height: 100%;">
                                    
                                    <img src="/static/img/comment_wordcloud.jpg" 
                                         alt="视频评论词云图" 
                                         class="img-fluid shadow-sm" 
                                         style="max-width: 100%; height: auto; border-radius: 4px;"
                                         onerror="this.onerror=null; this.src='/static/img/comment_wordcloud.jpg'">

                                    <div class="loading-spinner" id="wordcloud-loading" style="display: flex;">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="sr-only">加载中...</span>
                                        </div>
                                    </div>
                                    
                                </div> </div> </div> </div> </div>
            </div>
        </div>
    </section>
</div>
    <script>
        window.addEventListener('load', function() {
            var loader = document.getElementById('wordcloud-loading');
            if (loader) {
                loader.style.display = 'none';
            }
        });
    </script>
{% endblock %}
