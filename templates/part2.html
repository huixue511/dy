{% extends 'base.html' %}
{% block content %}
{% load static %}
    <div class="page-content">
    <h1 class="page-title">
        <i class="fa fa-home"></i>
        用户地区分布
    </h1>
    <section class="no-padding-bottom">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-6">
                    <div class="block" style="background: #ffffff; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 30px; border: 1px solid #eee;">
                        
                        <div class="title">
                            <strong class="d-block" style="color: #4e73df; font-size: 1.2rem; font-weight: 600; margin-bottom: 5px;">
                                粉丝区间分布
                            </strong>
                            <span class="d-block text-muted small" style="letter-spacing: 0.5px;">
                                粉丝区间
                            </span>
                        </div>
    
                        <div class="block-body p-0" style="margin-top: 15px;">
                            <div id="main1" style="width: 100%; height: 600px; border-radius: 8px; background: linear-gradient(to bottom, #ffffff, #fcfdff);"></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="block" style="background: #ffffff; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 30px; border: 1px solid #eee;">
                        
                        <div class="title">
                            <strong class="d-block" style="color: #4e73df; font-size: 1.2rem; font-weight: 600; margin-bottom: 5px;">
                                粉丝排行前十
                            </strong>
                            <span class="d-block text-muted small" style="letter-spacing: 0.5px;">
                                粉丝数量最多的博主
                            </span>
                        </div>
    
                        <div class="block-body p-0" style="margin-top: 15px;">
                            <div id="main2" style="width: 100%; height: 600px; border-radius: 8px; background: linear-gradient(to bottom, #ffffff, #fcfdff);"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </div>
    
    <script src = "{% static 'js/echarts.js' %}"></script>
    <script src="https://fastly.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
    <script>
    var chartDom = document.getElementById('main1');
    var myChart = echarts.init(chartDom);
    var option;
    
    option = {
        // 提示框美化：改为悬浮深色半透明风格
        tooltip: {
            trigger: 'item',
            backgroundColor: 'rgba(50, 50, 50, 0.8)',
            borderWidth: 0,
            padding: 10,
            textStyle: {
                color: '#fff',
                fontSize: 14
            },
            formatter: '{b}: {c} ({d}%)'
        },
        
        // 图例美化：放在底部，横向排列，更节省空间
        legend: {
            bottom: '5%',
            left: 'center',
            itemWidth: 10,
            itemHeight: 10,
            textStyle: {
                color: '#666'
            }
        },

        // 重新配色：选用一组和谐、专业的商业配色（蓝、绿、青、紫、橙）
        color: ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272', '#fc8452', '#9a60b4'],

        series: [
            {
                name: '粉丝区间',
                type: 'pie',
                radius: '65%', // 稍微调大一点，视觉更饱满
                center: ['50%', '45%'], // 中心点微调，给下方留出图例位置
                
                // 重点：美化每个扇区的样式
                itemStyle: {
                    // 添加细微的圆角效果（即使是实心饼图，微小的圆角也会显得精致）
                    borderRadius: 4,
                    // 扇区之间的白色间隙，增加呼吸感
                    borderColor: '#fff',
                    borderWidth: 2,
                    // 柔和的阴影效果
                    shadowBlur: 10,
                    shadowColor: 'rgba(0, 0, 0, 0.05)',
                    shadowOffsetX: 0,
                    shadowOffsetY: 5
                },
                
                // 标签样式美化
                label: {
                    show: true,
                    position: 'outside',
                    formatter: '{b}\n{d}%',
                    color: '#444',
                    fontSize: 12
                },

                // 引导线美化
                labelLine: {
                    lineStyle: {
                        color: '#ddd'
                    },
                    smooth: 0.2,
                    length: 10,
                    length2: 20
                },

                data: {{ result|safe }},
                
                // 鼠标悬停时的放大效果优化
                emphasis: {
                    scale: true,
                    scaleSize: 10,
                    itemStyle: {
                        shadowBlur: 20,
                        shadowColor: 'rgba(0, 0, 0, 0.2)'
                    }
                }
            }
        ]
    };

    // 窗口自适应
    window.addEventListener('resize', function() {
        myChart.resize();
    });

    option && myChart.setOption(option);
</script>
    
    <script>
    var chartDom = document.getElementById('main2');
    var myChart = echarts.init(chartDom);
    var option;
    
    option = {
      tooltip: {
        trigger: 'axis',
        axisPointer: {
          type: 'shadow'
        }
      },
      grid: {
        left: '3%',
        right: '4%',
        bottom: '3%',
        containLabel: true
      },
      xAxis: [
        {
          type: 'category',
          data: {{ name_list|safe }},
          axisTick: {
            alignWithLabel: true
          }
        }
      ],
      yAxis: [
        {
          type: 'value'
        }
      ],
      series: [
        {
          name: '粉丝数量',
          type: 'bar',
          barWidth: '60%',
          data: {{ value_list|safe }}
        }
      ]
    };
    
    option && myChart.setOption(option);

    </script>
{% endblock %}
